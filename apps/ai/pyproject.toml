[project]
name = "vcip-ai"
version = "0.0.0"
description = "V-CIP AI service — liveness, face match, OCR (assistive only)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
