# V-CIP Core MVP — Render blueprint.
#
# Deploys the two long-running server processes and the Redis they share:
#
#   vcip-api   apps/api   NestJS Control API — public HTTPS + WebSocket
#   vcip-ai    apps/ai    FastAPI analyzer   — reached over the private network
#   vcip-redis            Render Key Value   — private network only
#
# PostgreSQL is NOT here. Render's free Postgres expires 30 days after
# creation, which would take the demo down without warning; the blueprint
# expects a DATABASE_URL from a provider whose free tier does not expire.
# See docs/07-deployment.md.
#
# The two browser applications are not here either. They are static-heavy
# Next.js apps and belong on a CDN, not on a 0.1-CPU instance competing with
# the API for it.
#
# Everything below is the free tier. The one number to watch is Render's grant
# of 750 free instance-hours per workspace per month, shared by BOTH services:
# two processes awake around the clock need ~1,460. docs/07-deployment.md
# section 6 has the arithmetic and the knob.

services:
  # ------------------------------------------------------------------- redis
  # D2: temporary and real-time state only. The free plan holds 25 MB and
  # never writes to disk, and that is not a compromise here — a Redis flush
  # may degrade the queue and the HUD and may never corrupt business state,
  # which is exactly the guarantee D2 already demands.
  #
  # An empty allow-list means no public access at all: reachable only from
  # services on this workspace's private network.
  - name: vcip-redis
    type: keyvalue
    plan: free
    region: singapore
    ipAllowList: []
    maxmemoryPolicy: noeviction

  # --------------------------------------------------------------------- api
  - name: vcip-api
    type: web
    runtime: node
    plan: free
    region: singapore
    healthCheckPath: /health
    # The repository is a pnpm workspace and the API imports `@vcip/shared`, so
    # the build runs from the root and `rootDir` stays unset. Shared is built
    # first because `@vcip/api` resolves it through `dist/`, which does not
    # exist in a fresh checkout.
    buildCommand: corepack enable && pnpm install --frozen-lockfile && pnpm --filter @vcip/shared build && pnpm --filter @vcip/api build
    startCommand: node apps/api/dist/src/main.js
    envVars:
      - key: NODE_VERSION
        value: '22'
      - key: NODE_ENV
        value: production
      - key: LOG_LEVEL
        value: info

      # Pinned rather than left to Render's default, because `vcip-ai` builds
      # this service's private address from it and a blueprint cannot join a
      # hostname to a port. The same reason pins the AI service's port.
      - key: PORT
        value: '10000'

      # ---- browser origins (T14, T16) -------------------------------------
      # Filled in after the first Cloudflare deploy: the Workers subdomain is
      # not known until the app exists. Unset means no origin is allowed, which
      # is the safe direction to fail.
      - key: CUSTOMER_ORIGIN
        sync: false
      - key: AGENT_ORIGIN
        sync: false

      # ---- datastores -----------------------------------------------------
      # D1. Supplied by hand because Postgres is not hosted here; see the note
      # at the top of this file.
      - key: DATABASE_URL
        sync: false
      # D2. Private connection string, resolved by Render.
      - key: REDIS_URL
        fromService:
          name: vcip-redis
          type: keyvalue
          property: connectionString

      # ---- livekit (D24) --------------------------------------------------
      # Same code as local development, different values. `LIVEKIT_URL` is the
      # `wss://…livekit.cloud` address of the Cloud project.
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false

      # ---- credentials ----------------------------------------------------
      # Generated by Render, never seen by anyone, never in a file. The three
      # signing secrets must differ from one another — the API refuses to start
      # otherwise — and independently generated values do.
      - key: VCIP_CUSTOMER_TOKEN_SECRET
        generateValue: true
      - key: VCIP_AGENT_JWT_SECRET
        generateValue: true
      - key: VCIP_WS_TOKEN_SECRET
        generateValue: true
      # D10's shared internal credential. Generated here and read from here by
      # `vcip-ai`, so there is one value rather than two that could drift.
      - key: VCIP_INTERNAL_TOKEN
        generateValue: true
      - key: WS_TOKEN_TTL
        value: 60s

      # ---- ai (D6) --------------------------------------------------------
      # The private-network address, so `/internal/*` between our own processes
      # does not leave Render. The AI service's public URL still exists and its
      # internal routes are still guarded by the shared token — see
      # docs/07-deployment.md section 8.
      - key: AI_ENABLED
        value: 'true'
      - key: AI_INTERNAL_URL
        value: http://vcip-ai:10000

      # ---- evidence recording ---------------------------------------------
      # Off. The Core MVP stops before the evidence pipeline (T38+), so nothing
      # downstream would read the file, and LiveKit's free tier allows 60
      # transcode-minutes a month — about a dozen calls — which the demo would
      # spend on recordings nobody processes. Off also means no object store is
      # needed, so no `S3_*` variable appears anywhere in this blueprint.
      - key: RECORDING_ENABLED
        value: 'false'

      - key: OFFER_SWEEPER_INTERVAL_MS
        value: '5000'

  # ---------------------------------------------------------------------- ai
  # D20: one AI service, separate from the Control API, holding no PostgreSQL
  # and no Redis credentials (development plan 2.5). Every state change it
  # causes goes back through `/internal/ai/result`.
  - name: vcip-ai
    type: web
    runtime: python
    plan: free
    region: singapore
    rootDir: apps/ai
    healthCheckPath: /health
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: '3.12'
      - key: LOG_LEVEL
        value: info

      # Pinned so `vcip-api` can name this address; see the API's PORT.
      - key: PORT
        value: '10000'

      # D10: the same shared credential the Control API generated, read across
      # rather than declared twice.
      - key: VCIP_INTERNAL_TOKEN
        fromService:
          name: vcip-api
          type: web
          envVarKey: VCIP_INTERNAL_TOKEN
      - key: AI_CONTROL_API_URL
        value: http://vcip-api:10000

      # T29: deterministic stand-ins seeded from the session id. No vendor is
      # chosen and none is needed for the Core MVP.
      - key: AI_PROVIDER_MODE
        value: mock

      # The one setting this deployment adds. A free instance has 0.1 of a
      # core, and the T05 spike measured full-frame conversion at 720p costing
      # ~23 ms — most of a whole core for one call. Asking the server for the
      # lowest simulcast layer cuts both the decode and the conversion by more
      # than an order of magnitude. It changes no answer: the providers are
      # seeded from the session id, so a frame's pixels reach no decision.
      - key: AI_VIDEO_QUALITY
        value: low

      # The documented cadence, restated rather than left to defaults so the
      # numbers that decide whether one core keeps up are visible here.
      - key: AI_SAMPLE_INTERVAL_MS
        value: '250'
      - key: AI_CHECK_INTERVAL_MS
        value: '2000'
      - key: AI_OCR_INTERVAL_MS
        value: '5000'
      - key: AI_TRACK_TIMEOUT_S
        value: '30'
